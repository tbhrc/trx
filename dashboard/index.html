<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AI Trading Copilot – Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 2rem;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .card {
      background: #111827;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      min-width: 220px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .card h2 {
      font-size: 1rem;
      margin: 0 0 0.5rem 0;
    }

    .label {
      font-size: 0.75rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .value {
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      margin-right: 4px;
    }

    .badge-long {
      background: #065f46;
      color: #ecfdf5;
    }

    .badge-short {
      background: #7f1d1d;
      color: #fef2f2;
    }

    .badge-sideways {
      background: #374151;
      color: #e5e7eb;
    }

    .timestamp {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 0.25rem;
    }

    .no-signal {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 0.5rem;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <h1>AI Trading Copilot</h1>
  <div class="subtitle">Live view of the latest signal per instrument (via /signal/latest).</div>

  <div id="cards" class="cards"></div>

  <div class="footer">
    Backend: FastAPI • Data: CSV via DataFeed • Strategy: v1.2.1 (News Filter Enabled)
  </div>


  <script>
    const instruments = ["EURUSD", "GBPUSD", "XAUUSD", "NAS100", "BTCUSD"];
    const baseUrl = window.location.origin;

    function badgeForDirection(direction) {
      if (direction === "long") {
        return '<span class="badge badge-long">LONG</span>';
      }
      if (direction === "short") {
        return '<span class="badge badge-short">SHORT</span>';
      }
      return "";
    }

    function badgeForTrend(trend) {
      if (!trend) return "";
      let cls = "badge-sideways";
      if (trend === "uptrend") cls = "badge-long";
      if (trend === "downtrend") cls = "badge-short";
      return '<span class="badge ' + cls + '">' + trend.toUpperCase() + '</span>';
    }

    async function fetchSignal(symbol) {
      const url = baseUrl + "/signal/latest?instrument=" + encodeURIComponent(symbol);
      try {
        const res = await fetch(url);
        if (!res.ok) {
          return { instrument: symbol, error: "HTTP " + res.status };
        }
        const data = await res.json();
        return data || { instrument: symbol, signal: null };
      } catch (err) {
        return { instrument: symbol, error: String(err) };
      }
    }

    async function refreshSignals() {
      const container = document.getElementById("cards");
      container.innerHTML = "";
      const results = await Promise.all(instruments.map(fetchSignal));

      results.forEach((data, idx) => {
        const symbol = instruments[idx];
        const card = document.createElement("div");
        card.className = "card";

        let inner = "<h2>" + symbol + "</h2>";

        if (!data || data.error) {
          inner += '<div class="no-signal">Error: ' + (data && data.error ? data.error : "No data") + "</div>";
        } else if (!data.instrument) {
          inner += '<div class="no-signal">No signal yet</div>';
        } else {
          inner += '<div class="value">' +
            badgeForDirection(data.direction) +
            badgeForTrend(data.trend_regime) +
            "</div>";
          inner += '<div class="value"><span class="label">Entry</span> ' + data.entry + "</div>";
          inner += '<div class="value"><span class="label">Stop</span> ' + data.stop + "</div>";
          inner += '<div class="value"><span class="label">TP1</span> ' + data.tp1 + "</div>";
          if (data.tp2) {
            inner += '<div class="value"><span class="label">TP2</span> ' + data.tp2 + "</div>";
          }

          // News filter fields (v1.2.1)
          if (typeof data.news_blocked !== 'undefined') {
            const newsIcon = data.news_blocked ? '🔴' : '🟢';
            const newsText = data.news_blocked ? 'Blocked' : 'Clear';
            inner += '<div class="value"><span class="label">News</span> ' + newsIcon + ' ' + newsText + '</div>';
          }

          if (typeof data.sentiment_score !== 'undefined' && data.sentiment_score !== 0) {
            const sentIcon = data.sentiment_score > 0 ? '📈' : '📉';
            inner += '<div class="value"><span class="label">Sentiment</span> ' + sentIcon + ' ' + data.sentiment_score.toFixed(2) + '</div>';
          }

          if (data.timestamp) {
            inner += '<div class="timestamp">Signal time: ' + data.timestamp + "</div>";
          }
        }

        card.innerHTML = inner;
        container.appendChild(card);
      });
    }

    function bootstrap() {
      refreshSignals();
      setInterval(refreshSignals, 30000);
    }

    bootstrap();
  </script>

</body>

</html>
