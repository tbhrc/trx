<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Trading Copilot - Dashboard v1.2.4</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="header-title">
      <h1>AI Trading Copilot</h1>
      <p class="subtitle">Real-time signal monitoring with news sentiment analysis</p>
    </div>

    <div class="header-controls">
      <!-- Connection Status -->
      <div class="status">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-connection">Connecting...</span>
      </div>

      <!-- Signal Count -->
      <div class="status">
        <span id="status-text">Loading...</span>
      </div>

      <!-- Controls -->
      <button id="refresh-btn" class="btn btn-secondary" title="Manual refresh">
        🔄 Refresh
      </button>

      <button id="pause-btn" class="btn btn-secondary" title="Pause auto-refresh">
        ⏸️ Pause
      </button>
    </div>
  </header>

  <!-- Countdown Timer -->
  <div style="text-align: center; margin-bottom: 1.5rem;">
    <span id="countdown" style="color: var(--text-muted); font-size: 0.875rem;">
      Auto-refresh enabled
    </span>
  </div>

  <!-- Signals Grid -->
  <div id="signals-grid" class="signals-grid">
    <!-- Cards will be inserted here by JavaScript -->
    <div class="loading">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer
    style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--bg-tertiary); text-align: center; color: var(--text-muted); font-size: 0.875rem;">
    <p>AI Trading Copilot v1.2.4 | Enhanced Signal Dashboard</p>
    <p style="margin-top: 0.5rem; font-size: 0.75rem;">
      Auto-refresh: 10s | News Filter: Enabled | Performance Optimized
    </p>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
